name: Build RFS Binaries

on:
  push:
    tags:
      - 'release*'
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            cc: g++
            cflags: "-O3 -Wall -Wextra -static"
            artifact_name: rfs-linux-x86_64
            arch: x86_64
          - os: windows
            runner: ubuntu-latest
            cc: x86_64-w64-mingw32-g++
            cflags: "-O3 -Wall -Wextra -static"
            artifact_name: rfs-windows-x86_64.exe
            arch: x86_64
          - os: macos
            runner: macos-latest
            cc: clang++
            cflags: "-O3 -Wall -Wextra -std=c++11"
            artifact_name: rfs-macos-arm64
            arch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux/Windows Cross Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64

      - name: Compile
        run: |
          ${{ matrix.cc }} ${{ matrix.cflags }} rfs.cpp -o ${{ matrix.artifact_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

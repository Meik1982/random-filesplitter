name: CI & Build RFS Binaries (Rust v3.0.0)

on:
  push:
    branches:
      - main
      - 'feat/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        run: cargo test --verbose

      - name: Build Release & Run Diagnostics
        run: |
          cargo build --release
          ./target/release/rfs --entropy-test
          ./target/release/rfs --benchmark

  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/rfs
            artifact_name: rfs-linux-x86_64
            arch: x86_64
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/rfs.exe
            artifact_name: rfs-windows-x86_64.exe
            arch: x86_64
          - os: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/rfs
            artifact_name: rfs-macos-arm64
            arch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p bin_dist
          cp ${{ matrix.binary }} bin_dist/${{ matrix.artifact_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin_dist/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rfs-linux-x86_64
            dist/rfs-windows-x86_64.exe
            dist/rfs-macos-arm64
          generate_release_notes: true

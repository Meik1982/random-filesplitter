[package]
name = "random-filesplitter"
version = "3.0.0"
edition = "2021"
authors = ["Meik Augenblick"]
license = "LGPL-3.0-or-later"
description = "Cryptographically secure file splitter & reconstructor with plausible deniability, ChaCha20, and 384-bit PQ BLKS integrity"

[lib]
name = "rfs_core"
path = "src/lib.rs"

[[bin]]
name = "rfs"
path = "src/main.rs"

[[bin]]
name = "rfs-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:slint", "dep:slint-build", "dep:rfd"]

[dependencies]
blks-core = { git = "https://github.com/Meik1982/blks.git" }
chacha20 = "0.9"
sha2 = "0.10"
getrandom = "0.2"
crossbeam-channel = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
libc = "0.2"
slint = { version = "1.18", optional = true }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tempfile = "3.17"

[[bench]]
name = "crypto_benchmarks"
harness = false

[build-dependencies]
slint-build = { version = "1.18", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
